name: Build and test macOS apps
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: macOS ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            rid: osx-arm64
          - runner: macos-15-intel
            rid: osx-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build, package, verify and run native DMG smoke checks
        run: bash macos/build-macos.sh '${{ matrix.rid }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macOS-smoke-evidence-${{ matrix.rid }}
          path: |
            ${{ runner.temp }}/gamma-${{ matrix.rid }}-evidence/
            macos/dist/${{ matrix.rid }}/architecture.txt
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: GammaCNFReader-macOS-${{ matrix.rid }}
          path: macos/dist/${{ matrix.rid }}/GammaCNFReader-macOS-${{ matrix.rid }}.dmg
          if-no-files-found: error
