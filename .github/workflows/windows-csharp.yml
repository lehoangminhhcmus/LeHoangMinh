name: Build and release Windows app
on:
  workflow_dispatch:
  push:
    branches: ['main']
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate installer script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path windows/Install-User.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
      - name: Test and publish
        shell: cmd
        run: windows\build-windows.bat
      - name: Run Windows WPF smoke checks
        shell: pwsh
        run: |
          dotnet run --project windows/GammaCnf.Checks -c Release -- --write-fixture "$env:RUNNER_TEMP/smoke.cnf"
          if ($LASTEXITCODE) { throw 'Fixture generation failed' }
          $exe = Resolve-Path windows/dist/app/GammaCNFReader.exe
          $out = Join-Path $env:RUNNER_TEMP 'gamma-ui-smoke'
          $process = Start-Process -FilePath $exe -ArgumentList @('--smoke-test', "`"$env:RUNNER_TEMP/smoke.cnf`"", "`"$out`"") -PassThru
          if (!$process.WaitForExit(60000)) { Stop-Process -Id $process.Id -Force; throw 'WPF smoke check timed out' }
          if ($process.ExitCode -ne 0 -or !(Test-Path "$out/ui-smoke-success.txt")) {
            if (Test-Path "$out/ui-smoke-error.txt") { Get-Content "$out/ui-smoke-error.txt" }
            throw 'WPF smoke check failed'
          }
          Get-Content "$out/ui-smoke-success.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WPF-smoke-evidence
          path: ${{ runner.temp }}/gamma-ui-smoke/
          if-no-files-found: ignore
      - name: Verify installer and package portable app
        shell: pwsh
        run: |
          if (!(Test-Path windows/dist/installer/GammaCNFReader-CSharp-Setup.exe)) { throw 'Installer missing; Inno Setup 6 must be installed.' }
          Copy-Item windows/Install.cmd, windows/Install-User.ps1, windows/README.md windows/dist/app/
          Compress-Archive -Path windows/dist/app/* -DestinationPath windows/dist/GammaCNFReader-CSharp-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: GammaCNFReader-CSharp-Windows-x64
          path: |
            windows/dist/GammaCNFReader-CSharp-Windows-x64.zip
            windows/dist/installer/GammaCNFReader-CSharp-Setup.exe
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GammaCNFReader-CSharp-Windows-x64
          path: release-files
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" \
            release-files/GammaCNFReader-CSharp-Windows-x64.zip \
            release-files/installer/GammaCNFReader-CSharp-Setup.exe \
            --title "Gamma CNF Reader $RELEASE_TAG (Windows x64)" \
            --notes-file windows/RELEASE_NOTES.md --latest --verify-tag
